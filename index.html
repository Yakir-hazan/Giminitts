<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>עץ הקסם - תווית דמות</title>
<style>
  body {
    background: #0d1b14;
    margin: 0;
    padding: 0;
  }
  .tree-character {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-image: url('tree.png');
    background-size: cover;
    background-position: center top;
    overflow: hidden;
  }
  /* שקע כהה ובלתי-סדיר מאחורי העין - מדמה חריץ/קרע בקליפה שהעין יושבת בתוכו,
     כך שהיא נראית חלק מהעץ ולא מודבקת מעליו */
  .eye-socket {
    position: absolute;
    width: 175px;
    height: 115px;
    border-radius: 55% 45% 50% 50% / 60% 55% 45% 40%;
    background: radial-gradient(ellipse at center, rgba(20,12,5,0.55) 0%, rgba(20,12,5,0.35) 45%, rgba(20,12,5,0) 75%);
    filter: blur(6px);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  /* עיניים - ממוקמות זו ליד זו מעל חריץ הפה, בגוון זהוב כדי ליצור
     מבנה פנים ברור ולהבדיל אותן מהגחליליות הרגילות בתמונה */
  .eye {
    position: absolute;
    width: 140px;
    height: 88px;
    border-radius: 50%;
    /* "לבן" העין - גוון שנהבי-קרמי שמתאים לתאורת היער, לא לבן נקי */
    background: radial-gradient(ellipse at center, #F2E9D8 0%, #E4D7BE 50%, #B8A684 78%, rgba(120,100,70,0) 100%);
    /* מסיכת דהייה - הקצוות נעלמים בהדרגה במקום קו חיתוך חד, כך שהלבן מתמזג בקליפה */
    -webkit-mask-image: radial-gradient(ellipse at center, black 45%, transparent 80%);
    mask-image: radial-gradient(ellipse at center, black 45%, transparent 80%);
    mix-blend-mode: overlay;
    box-shadow:
      0 0 16px 4px rgba(250, 199, 117, 0.4),
      inset 0 2px 4px rgba(0,0,0,0.35);
    overflow: hidden;
    transform: translate(-50%, -50%);
    transition: transform 0.2s ease;
  }

  /* קשתית - טבעת זהובה-ירקרקה סביב האישון */
  .eye::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, #F2A93C 0%, #C9821F 45%, #6e4a16 75%, #2e1c0c 100%);
    box-shadow: 0 0 12px 3px rgba(250, 199, 117, 0.75);
    transform: translate(-50%, -50%);
    animation: irisGlow 3.4s ease-in-out infinite;
  }
  @keyframes irisGlow {
    0%, 100% { box-shadow: 0 0 12px 3px rgba(250, 199, 117, 0.75); }
    50% { box-shadow: 0 0 20px 6px rgba(250, 199, 117, 0.95); }
  }
  /* אישון - שחור עם נקודת אור (קטרקט) שנותנת חיים לעין */
  .eye::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #0b0704;
    box-shadow:
      -3px -3px 0 1.5px rgba(255,255,255,0.95),
      0 0 6px 2px rgba(0,0,0,0.7);
    transform: translate(-50%, -50%);
  }
  /* עפעף עליון - קשת כהה עדינה שיוצרת מעבר טבעי בין הגזע לעין, כמו צל גבה/עפעף */
  .eye-lid {
    position: absolute;
    width: 100px;
    height: 56px;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    background: linear-gradient(to bottom, rgba(20,12,5,0.55) 0%, rgba(20,12,5,0) 100%);
    transform: translate(-50%, -78%);
    pointer-events: none;
  }
  .eye-lid-left { top: 42%; left: 39%; }
  .eye-lid-right { top: 42%; left: 65%; }
  .eye-socket-left {
    top: 42%;
    left: 39%;
  }
  .eye-socket-right {
    top: 42%;
    left: 65%;
  }
  .eye-left {
    top: 42%;
    left: 39%;
  }
  .eye-right {
    top: 42%;
    left: 65%;
  }
  /* אנימציית מצמוץ עדינה */
  @keyframes blink {
    0%, 92%, 100% { transform: translate(-50%, -50%) scaleY(1); }
    95% { transform: translate(-50%, -50%) scaleY(0.1); }
  }
  .eye {
    animation: blink 5s infinite;
  }
  /* פה - מסגרת חריץ זוהרת לגרירת תשובה */
  .mouth-slot {
    position: absolute;
    top: 58%;
    left: 53%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 60px;
    border-radius: 18px;
    border: 2px dashed #FAC775;
    background: rgba(26, 16, 51, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px 6px rgba(250, 199, 117, 0.25) inset;
  }
  .mouth-slot.drag-over {
    border-style: solid;
    box-shadow: 0 0 26px 10px rgba(250, 199, 117, 0.5) inset;
  }
  .mouth-slot .placeholder-glow {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(250,199,117,0.9) 0%, transparent 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FAC775;
    font-size: 22px;
    font-weight: 500;
    font-family: sans-serif;
  }
  .mouth-slot.correct {
    animation: correctPulse 0.6s ease;
  }
  @keyframes correctPulse {
    0% { box-shadow: 0 0 20px 6px rgba(250, 199, 117, 0.25) inset; }
    50% { box-shadow: 0 0 40px 16px rgba(93, 202, 165, 0.8) inset; }
    100% { box-shadow: 0 0 20px 6px rgba(250, 199, 117, 0.25) inset; }
  }
</style>
</head>
<body>
<div class="tree-character" id="treeCharacter">
  <div class="eye-socket eye-socket-left"></div>
  <div class="eye-socket eye-socket-right"></div>
  <div class="eye eye-left"></div>
  <div class="eye eye-right"></div>
  <div class="eye-lid eye-lid-left"></div>
  <div class="eye-lid eye-lid-right"></div>
  <div class="mouth-slot" id="mouthSlot">
    <div class="placeholder-glow">?</div>
  </div>
</div>
<script>
  // דוגמה לבדיקת drag-over (מתחבר לאותה לוגיקה שכבר יש לך לגרירת מילים)
  const slot = document.getElementById('mouthSlot');
  slot.addEventListener('dragover', (e) => {
    e.preventDefault();
    slot.classList.add('drag-over');
  });
  slot.addEventListener('dragleave', () => {
    slot.classList.remove('drag-over');
  });
  slot.addEventListener('drop', (e) => {
    e.preventDefault();
    slot.classList.remove('drag-over');
    slot.classList.add('correct');
    setTimeout(() => slot.classList.remove('correct'), 600);
  });
</script>
</body>
</html>
