<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini TTS — מחולל סקריפט</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f1117;
    color: #e8e8e8;
    min-height: 100vh;
    padding: 2rem 1rem;
    direction: rtl;
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 0.25rem; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 2rem; }
  .card {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 1rem;
  }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .input-row { display: flex; gap: 6px; }
  input[type="text"], input[type="password"] {
    flex: 1;
    background: #0f1117;
    border: 1px solid #2a2d3a;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 13px;
    font-family: 'Consolas', monospace;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
    direction: ltr;
    text-align: left;
  }
  input:focus { border-color: #4a6cf7; }
  button {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  button:hover { background: #22263a; border-color: #3a3d52; }
  button:active { transform: scale(0.98); }
  .btn-primary { background: #4a6cf7; border-color: #4a6cf7; color: #fff; font-weight: 500; }
  .btn-primary:hover { background: #3a5ce6; border-color: #3a5ce6; }
  .output-box {
    background: #0a0c12;
    border: 1px solid #2a2d3a;
    border-radius: 8px;
    padding: 1rem;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #c8d0e8;
    white-space: pre-wrap;
    word-break: break-all;
    direction: ltr;
    text-align: left;
    min-height: 56px;
  }
  .output-box.placeholder { color: #444; font-style: italic; direction: rtl; text-align: right; font-family: inherit; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions button { font-size: 12px; padding: 7px 14px; }
  .hint { font-size: 11px; color: #555; margin-top: 5px; }
  code { font-size: 12px; color: #aaa; font-family: 'Consolas', monospace; }
</style>
</head>
<body>
<div class="container">

  <h1>Gemini TTS — מחולל סקריפט</h1>
  <p class="subtitle">הכנס מפתח פעם אחת — הכלי מכניס אותו לסקריפט ולפקודה</p>

  <div class="card">
    <div class="card-title">מפתח API</div>
    <div class="field">
      <label>Gemini API Key</label>
      <div class="input-row">
        <input type="password" id="api-key" placeholder="AIzaSy..." oninput="sync()" />
        <button onclick="toggleKey()" id="toggle-btn">הצג</button>
      </div>
      <p class="hint">המפתח נשמר רק בדפדפן — לא יוצא לשום מקום</p>
    </div>
  </div>

  <div class="card">
    <div class="card-title">הגדרות</div>
    <div class="field">
      <label>נתיב לתיקיית הפרויקט</label>
      <input type="text" id="folder" style="width:100%"
        value="/private/var/mobile/Containers/Shared/AppGroup/AD3A26B6-23EE-48B9-96E0-8F14661D28B4/File Provider Storage/הורדות/Tirgolon-main 22"
        oninput="sync()" />
    </div>
    <div class="field">
      <label>תיקיית פלט לאודיו</label>
      <input type="text" id="audio-out" style="width:100%" value="./audio_words" oninput="sync()" />
    </div>
    <div class="field">
      <label>קול</label>
      <input type="text" id="voice" style="width:100%" value="Kore" oninput="sync()" />
    </div>
    <div class="field">
      <label>מודל</label>
      <input type="text" id="model" style="width:100%" value="gemini-3.1-flash-tts-preview" oninput="sync()" />
    </div>
    <div class="field" style="margin-bottom:0">
      <label>השהייה בין מילים (ms)</label>
      <input type="text" id="delay" style="width:100%" value="10000" oninput="sync()" />
    </div>
  </div>

  <div class="card">
    <div class="card-title">פקודה להרצה</div>
    <div class="output-box placeholder" id="cmd-box">← הכנס מפתח כדי לייצר פקודה</div>
    <div class="actions">
      <button onclick="copyCmd()" id="copy-cmd-btn">העתק פקודה</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">סקריפט JS</div>
    <p style="font-size:13px; color:#888; margin-bottom:1rem;">
      קובץ <code>generate_words_audio.js</code> עם המפתח וכל ההגדרות בפנים — מוכן להריץ עם <code>node</code>
    </p>
    <div class="actions">
      <button class="btn-primary" onclick="downloadJS()">הורד generate_words_audio.js</button>
    </div>
  </div>

</div>
<script>
function getKey()      { return document.getElementById('api-key').value.trim(); }
function getFolder()   { return document.getElementById('folder').value.trim(); }
function getAudioOut() { return document.getElementById('audio-out').value.trim() || './audio_words'; }
function getVoice()    { return document.getElementById('voice').value.trim() || 'Kore'; }
function getModel()    { return document.getElementById('model').value.trim() || 'gemini-3.1-flash-tts-preview'; }
function getDelay()    { return parseInt(document.getElementById('delay').value) || 10000; }

function sync() {
  const key = getKey();
  const box = document.getElementById('cmd-box');
  if (!key) {
    box.textContent = '← הכנס מפתח כדי לייצר פקודה';
    box.classList.add('placeholder');
    return;
  }
  box.classList.remove('placeholder');
  box.textContent = 'export GEMINI_KEY="' + key + '"\ncd "' + getFolder() + '" && node generate_words_audio.js';
}

function toggleKey() {
  const el = document.getElementById('api-key');
  const btn = document.getElementById('toggle-btn');
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? 'הצג' : 'הסתר';
}

function copyCmd() {
  if (!getKey()) { alert('הכנס מפתח קודם'); return; }
  navigator.clipboard.writeText(document.getElementById('cmd-box').textContent).then(() => {
    const btn = document.getElementById('copy-cmd-btn');
    const orig = btn.textContent;
    btn.textContent = '✓ הועתק!';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

function buildJS() {
  const key      = getKey();
  const audioOut = getAudioOut();
  const voice    = getVoice();
  const model    = getModel();
  const delay    = getDelay();

  return `/**
 * generate_words_audio.js
 * מייצר קובצי אודיו ל-words.json עם טונציות
 * Node 16 — ללא תלויות חיצוניות
 */

const https = require('https');
const fs = require('fs');
const path = require('path');

const API_KEY    = process.env.GEMINI_KEY || '${key}';
const OUTPUT_DIR = '${audioOut}';
const MODEL      = '${model}';
const VOICE      = '${voice}';
const DELAY_MS   = ${delay};

function callGeminiTTS(text, tone) {
  return new Promise((resolve, reject) => {
    const taggedText = tone ? '[' + tone + '] ' + text : text;

    const body = JSON.stringify({
      contents: [{ parts: [{ text: taggedText }] }],
      generationConfig: {
        responseModalities: ['AUDIO'],
        speechConfig: {
          voiceConfig: {
            prebuiltVoiceConfig: { voiceName: VOICE }
          }
        }
      }
    });

    const options = {
      hostname: 'generativelanguage.googleapis.com',
      path: '/v1beta/models/' + MODEL + ':generateContent?key=' + encodeURIComponent(API_KEY),
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Content-Length': Buffer.byteLength(body)
      }
    };

    const req = https.request(options, (res) => {
      let data = '';
      res.on('data', chunk => data += chunk);
      res.on('end', () => {
        try {
          const json = JSON.parse(data);
          if (json.error) return reject(new Error(json.error.message));
          const audioB64 = json.candidates[0].content.parts[0].inlineData.data;
          resolve(audioB64);
        } catch (e) {
          reject(new Error('Parse error: ' + data.slice(0, 200)));
        }
      });
    });

    req.on('error', reject);
    req.write(body);
    req.end();
  });
}

function addWavHeader(pcmBuffer) {
  const dataSize = pcmBuffer.length;
  const header = Buffer.alloc(44);
  header.write('RIFF', 0);
  header.writeUInt32LE(dataSize + 36, 4);
  header.write('WAVE', 8);
  header.write('fmt ', 12);
  header.writeUInt32LE(16, 16);
  header.writeUInt16LE(1, 20);
  header.writeUInt16LE(1, 22);
  header.writeUInt32LE(24000, 24);
  header.writeUInt32LE(24000 * 2, 28);
  header.writeUInt16LE(2, 32);
  header.writeUInt16LE(16, 34);
  header.write('data', 36);
  header.writeUInt32LE(dataSize, 40);
  return Buffer.concat([header, pcmBuffer]);
}

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function main() {
  if (!API_KEY || API_KEY === 'YOUR_API_KEY_HERE') {
    console.error('הכנס GEMINI_KEY כ-environment variable');
    process.exit(1);
  }

  if (!fs.existsSync(OUTPUT_DIR)) fs.mkdirSync(OUTPUT_DIR, { recursive: true });

  const wordsJson = JSON.parse(fs.readFileSync('./words.json', 'utf8'));

  const words = [];
  for (const [letter, items] of Object.entries(wordsJson)) {
    for (const item of items) {
      const cleanWord = item.word.replace(/[\\u05B0-\\u05C7]/g, '');
      const filename = letter + '_' + cleanWord + '.wav';
      words.push({ letter, word: item.word, tone: item.tone || '', filename });
    }
  }

  console.log('מילים: ' + words.length);
  console.log('קול: ' + VOICE + ' | פלט: ' + OUTPUT_DIR + '/\\n');

  let success = 0, failed = 0;

  for (let i = 0; i < words.length; i++) {
    const { word, tone, filename } = words[i];
    const progress = '[' + (i + 1) + '/' + words.length + ']';
    const filepath = path.join(OUTPUT_DIR, filename);

    if (fs.existsSync(filepath)) {
      console.log('קיים ' + progress + ': ' + filename);
      success++;
      continue;
    }

    try {
      const audioB64 = await callGeminiTTS(word, tone);
      const pcm = Buffer.from(audioB64, 'base64');
      fs.writeFileSync(filepath, addWavHeader(pcm));
      console.log('OK ' + progress + ' [' + tone + '] ' + word);
      success++;
    } catch (err) {
      console.error('ERR ' + progress + ' ' + word + ' -- ' + err.message);
      failed++;
    }

    if (i < words.length - 1) await sleep(DELAY_MS);
  }

  console.log('\\n==============================');
  console.log('הצליחו: ' + success);
  console.log('נכשלו:  ' + failed);
  console.log('סיום! ' + OUTPUT_DIR + '/');
}

main().catch(console.error);
`;
}

function downloadJS() {
  if (!getKey()) { alert('הכנס מפתח קודם'); return; }
  const blob = new Blob([buildJS()], { type: 'text/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'generate_words_audio.js';
  a.click();
}
</script>
</body>
</html>
