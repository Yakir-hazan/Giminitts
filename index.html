<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>עץ הקסם - תווית דמות</title>
<style>
  body {
    background: #0d1b14;
    margin: 0;
    padding: 0;
  }
  .tree-character {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-image: url('tree.png');
    background-size: cover;
    background-position: center top;
    overflow: hidden;
  }
  /* עיניים - ממוקמות זו ליד זו מעל חריץ הפה, בגוון זהוב כדי ליצור
     מבנה פנים ברור ולהבדיל אותן מהגחליליות הרגילות בתמונה */
  .eye {
    position: absolute;
    width: 130px;
    height: 78px;
    border-radius: 50%;
    /* "לבן" העין - גוון שנהבי-קרמי שמתאים לתאורת היער, לא לבן נקי */
    background: radial-gradient(ellipse at center, #F2E9D8 0%, #E4D7BE 70%, #C9BBA0 100%);
    box-shadow:
      0 0 18px 4px rgba(250, 199, 117, 0.35),
      inset 0 2px 4px rgba(0,0,0,0.35);
    overflow: hidden;
    transform: translate(-50%, -50%);
    transition: transform 0.2s ease;
  }
  /* קשתית - טבעת זהובה-ירקרקה סביב האישון */
  .eye::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle, #C9821F 0%, #7a5a1e 55%, #3d2c10 100%);
    box-shadow: 0 0 6px 1px rgba(250, 199, 117, 0.6);
    transform: translate(-50%, -50%);
  }
  /* אישון - שחור עם נקודת אור (קטרקט) שנותנת חיים לעין */
  .eye::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #0b0704;
    box-shadow:
      -3px -3px 0 1px rgba(255,255,255,0.85),
      0 0 4px 1px rgba(0,0,0,0.6);
    transform: translate(-50%, -50%);
  }
  .eye-left {
    top: 39%;
    left: 42%;
  }
  .eye-right {
    top: 39%;
    left: 57%;
  }
  /* אנימציית מצמוץ עדינה */
  @keyframes blink {
    0%, 92%, 100% { transform: translate(-50%, -50%) scaleY(1); }
    95% { transform: translate(-50%, -50%) scaleY(0.1); }
  }
  .eye {
    animation: blink 5s infinite;
  }
  /* פה - מסגרת חריץ זוהרת לגרירת תשובה */
  .mouth-slot {
    position: absolute;
    top: 50%;
    left: 49%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 60px;
    border-radius: 18px;
    border: 2px dashed #FAC775;
    background: rgba(26, 16, 51, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px 6px rgba(250, 199, 117, 0.25) inset;
  }
  .mouth-slot.drag-over {
    border-style: solid;
    box-shadow: 0 0 26px 10px rgba(250, 199, 117, 0.5) inset;
  }
  .mouth-slot .placeholder-glow {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(250,199,117,0.9) 0%, transparent 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FAC775;
    font-size: 22px;
    font-weight: 500;
    font-family: sans-serif;
  }
  .mouth-slot.correct {
    animation: correctPulse 0.6s ease;
  }
  @keyframes correctPulse {
    0% { box-shadow: 0 0 20px 6px rgba(250, 199, 117, 0.25) inset; }
    50% { box-shadow: 0 0 40px 16px rgba(93, 202, 165, 0.8) inset; }
    100% { box-shadow: 0 0 20px 6px rgba(250, 199, 117, 0.25) inset; }
  }
</style>
</head>
<body>
<div class="tree-character" id="treeCharacter">
  <div class="eye eye-left"></div>
  <div class="eye eye-right"></div>
  <div class="mouth-slot" id="mouthSlot">
    <div class="placeholder-glow">?</div>
  </div>
</div>
<script>
  // דוגמה לבדיקת drag-over (מתחבר לאותה לוגיקה שכבר יש לך לגרירת מילים)
  const slot = document.getElementById('mouthSlot');
  slot.addEventListener('dragover', (e) => {
    e.preventDefault();
    slot.classList.add('drag-over');
  });
  slot.addEventListener('dragleave', () => {
    slot.classList.remove('drag-over');
  });
  slot.addEventListener('drop', (e) => {
    e.preventDefault();
    slot.classList.remove('drag-over');
    slot.classList.add('correct');
    setTimeout(() => slot.classList.remove('correct'), 600);
  });
</script>
</body>
</html>
